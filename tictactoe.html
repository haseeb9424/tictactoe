<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Tic Tac Toe</title>
        <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0GBXLVBZBK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0GBXLVBZBK');
</script>
        <style>
            :root{--cell-size:100px}
            body{font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;margin:24px;background:#f3f4f6;color:#111}
            h1{margin:0 0 12px;font-size:24px}
            .status{margin-bottom:12px;font-size:18px}
            .board{display:grid;grid-template-columns:repeat(3,var(--cell-size));gap:10px}
            .cell{width:var(--cell-size);height:var(--cell-size);background:#fff;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;user-select:none}
            .cell:focus{outline:3px solid #60a5fa}
            .cell.winner{background:#d1fae5}
            .controls{margin-top:16px;display:flex;gap:8px;align-items:center}
            button{padding:8px 12px;font-size:15px;border-radius:6px;border:1px solid #bbb;background:#fff;cursor:pointer}
            @media (max-width:480px){:root{--cell-size:70px}.cell{font-size:36px}}
        </style>
    </head>
    <body>
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Current: X</div>

        <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
            <div class="cell" data-index="0" role="button" tabindex="0"></div>
            <div class="cell" data-index="1" role="button" tabindex="0"></div>
            <div class="cell" data-index="2" role="button" tabindex="0"></div>
            <div class="cell" data-index="3" role="button" tabindex="0"></div>
            <div class="cell" data-index="4" role="button" tabindex="0"></div>
            <div class="cell" data-index="5" role="button" tabindex="0"></div>
            <div class="cell" data-index="6" role="button" tabindex="0"></div>
            <div class="cell" data-index="7" role="button" tabindex="0"></div>
            <div class="cell" data-index="8" role="button" tabindex="0"></div>
        </div>

        <div class="controls">
            <button id="reset">Restart</button>
            <button id="ai">Play vs AI</button>
            <div style="margin-left:8px;font-size:14px;color:#444">Tip: use Enter/Space to mark focused cell</div>
        </div>

        <script>
            const boardEl = document.getElementById('board');
            const statusEl = document.getElementById('status');
            const resetBtn = document.getElementById('reset');
            const aiBtn = document.getElementById('ai');

            let board = Array(9).fill('');
            let current = 'X';
            let running = true;
            let vsAI = false;

            const winLines = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];

            function updateStatus(){
                if(!running) return;
                statusEl.textContent = 'Current: ' + current;
            }

            function checkWin(){
                for(const line of winLines){
                    const [a,b,c] = line;
                    if(board[a] && board[a] === board[b] && board[a] === board[c]){
                        return { winner: board[a], line };
                    }
                }
                if(board.every(Boolean)) return { draw: true };
                return null;
            }

            function render(){
                boardEl.querySelectorAll('.cell').forEach((cell,i)=>{
                    cell.textContent = board[i];
                    cell.classList.remove('winner');
                    cell.setAttribute('aria-label', `Cell ${i+1}, ${board[i] ? board[i] : 'empty'}`);
                });

                const res = checkWin();
                if(res){
                    running = false;
                    if(res.draw){
                        statusEl.textContent = 'Draw';
                    } else {
                        statusEl.textContent = res.winner + ' wins!';
                        res.line.forEach(i=> boardEl.children[i].classList.add('winner'));
                    }
                } else {
                    updateStatus();
                }
            }

            function makeMove(i){
                if(!running || board[i]) return;
                board[i] = current;
                render();

                const res = checkWin();
                if(res) return;

                current = current === 'X' ? 'O' : 'X';
                updateStatus();

                if(vsAI && current === 'O'){
                    setTimeout(aiMove, 250);
                }
            }

            function aiMove(){
                const empty = board.map((v,i)=> v ? null : i).filter(i=> i !== null);
                if(empty.length === 0) return;
                const move = findWinningMove('O') ?? findWinningMove('X') ?? empty[Math.floor(Math.random()*empty.length)];
                makeMove(move);
            }

            function findWinningMove(player){
                for(let i=0;i<9;i++){
                    if(board[i]) continue;
                    board[i] = player;
                    const win = winLines.some(line => line.every(idx => board[idx] === player));
                    board[i] = '';
                    if(win) return i;
                }
                return null;
            }

            boardEl.addEventListener('click', e=>{
                const cell = e.target.closest('.cell');
                if(!cell) return;
                const i = Number(cell.dataset.index);
                makeMove(i);
            });

            boardEl.addEventListener('keydown', e=>{
                if(e.key === 'Enter' || e.key === ' '){
                    const cell = e.target.closest('.cell');
                    if(!cell) return;
                    e.preventDefault();
                    makeMove(Number(cell.dataset.index));
                }
            });

            resetBtn.addEventListener('click', ()=>{
                board.fill('');
                current = 'X';
                running = true;
                render();
            });

            aiBtn.addEventListener('click', ()=>{
                vsAI = !vsAI;
                aiBtn.textContent = vsAI ? 'Play vs Human' : 'Play vs AI';
                if(vsAI && current === 'O') setTimeout(aiMove, 200);
            });

            render();
        </script>
    </body>
</html>
